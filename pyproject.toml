[project]
name = "futurisys-attrition-api"
version = "0.2.0"
description = "Projet Futurisys de prédiction de l'attrition des employés"
readme = "README.md"
authors = [{ name = "Benjamin Thery" }]
# Le modèle a été sérialisé sous Python 3.12.
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attrition_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=attrition_api --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 80
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
